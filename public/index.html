<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ứng dụng chat AI với Gemini — nhiều hội thoại, chọn model, lưu lịch sử." />
  <meta name="color-scheme" content="dark light" />
  <title>Gemini Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Danh sách hội thoại">
      <div class="sidebar-head">
        <div class="logo-mark" aria-hidden="true">✦</div>
        <div class="brand">
          <h1>Gemini Chat</h1>
          <p>Trợ lý AI đa hội thoại</p>
        </div>
      </div>

      <button type="button" class="new-chat-btn" id="new-chat-btn">＋ Hội thoại mới</button>

      <nav class="conversation-list" id="conversation-list" aria-label="Hội thoại đã lưu"></nav>

      <div class="sidebar-foot">
        <span id="theme-toggle" role="button" tabindex="0" aria-label="Đổi giao diện sáng/tối">☀️</span>
        <button type="button" class="icon-btn" id="export-btn" title="Export hội thoại (.md)" aria-label="Export hội thoại">⬇ Export</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <main class="main">
      <header class="chat-header">
        <button type="button" class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Mở danh sách hội thoại">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>

        <div class="model-select-wrap">
          <label for="model-select">Model</label>
          <select id="model-select" class="model-select" aria-label="Chọn model Gemini"></select>
        </div>

        <div class="header-spacer"></div>
        <button type="button" class="icon-btn" id="regenerate-btn" title="Tạo lại phản hồi" aria-label="Tạo lại phản hồi">↻</button>
        <div class="status-dot" id="status-dot"><span>Online</span></div>
      </header>

      <div class="chat-window" id="chat-window" role="log" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">✦</div>
          <h2>Bắt đầu hội thoại mới</h2>
          <p>Hỏi bất cứ điều gì — Gemini sẽ nhớ ngữ cảnh trong hội thoại. Lịch sử được lưu trên máy bạn.</p>
        </div>
      </div>

      <footer class="composer">
        <form id="chat-form" autocomplete="off">
          <div class="input-row">
            <textarea id="message-input" placeholder="Nhập câu hỏi của bạn..." rows="1" maxlength="4000" aria-label="Nội dung tin nhắn"></textarea>
            <button type="submit" id="send-btn" class="send-btn" aria-label="Gửi">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <div class="hint">Ctrl+Enter để gửi nhanh</div>
        </form>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
