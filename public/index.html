<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3350;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --user-bubble: #4f46e5;
      --ai-bubble: #1e2433;
      --radius: 16px;
    }
    html { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 1rem; font-weight: 700; line-height: 1.2;
      background: linear-gradient(135deg, var(--text), var(--accent-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-text p { font-size: 0.72rem; color: var(--text-muted); }
    .status-dot {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text-muted);
    }
    .status-dot::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 6px #22c55e;
    }
    #chat-window {
      flex: 1; overflow-y: auto; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1rem;
      max-width: 780px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; gap: 0.6rem; max-width: 85%; animation: slideIn 0.25s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.ai { align-self: flex-start; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #fff; margin-top: 2px;
    }
    .msg.user .avatar { background: var(--user-bubble); }
    .msg.ai .avatar { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .bubble {
      padding: 0.75rem 1rem; border-radius: var(--radius);
      line-height: 1.55; font-size: 0.92rem; white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bubble); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.ai .bubble {
      background: var(--ai-bubble); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .typing .bubble { display: flex; gap: 5px; align-items: center; min-height: 2.4rem; }
    .typing .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing .dot:nth-child(2) { animation-delay: 0.15s; }
    .typing .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .error-bubble { border-color: #dc2626 !important; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <div class="logo-mark">✦</div>
    <div class="header-text">
      <h1>Gemini Chat</h1>
      <p>Powered by Gemini 2.5 Flash</p>
    </div>
    <div class="status-dot" id="status-dot">Online</div>
  </header>

  <main id="chat-window" role="log" aria-live="polite">
    <div class="msg ai">
      <div class="avatar">✦</div>
      <div class="bubble">Chào bạn! Mình là Gemini ✦ Mình có thể giúp gì cho bạn hôm nay?</div>
    </div>
  </main>

  <footer>
    <form id="chat-form" autocomplete="off">
      <div class="input-row">
        <textarea id="message-input" placeholder="Nhập câu hỏi của bạn..." rows="1" maxlength="4000" aria-label="Nội dung tin nhắn"></textarea>
        <button type="submit" id="send-btn" aria-label="Gửi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="hint" id="hint">Ctrl+Enter để gửi nhanh</div>
    </form>
  </footer>

  <style>
    footer {
      position: sticky; bottom: 0;
      background: rgba(15, 17, 23, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }
    #chat-form { max-width: 780px; margin: 0 auto; }
    .input-row {
      display: flex; gap: 0.5rem; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.3rem 0.3rem 0.3rem 0.9rem;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 0.92rem;
      line-height: 1.5; resize: none; overflow: hidden;
      min-height: 1.5rem; max-height: 8rem; padding: 0.4rem 0;
    }
    textarea::placeholder { color: var(--text-muted); }
    #send-btn {
      width: 40px; height: 40px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: #6d28d9; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    .hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.3rem; padding: 0 0.4rem; }
  </style>
<script type="module">
  const form = document.querySelector("#chat-form");
  const input = document.querySelector("#message-input");
  const sendBtn = document.querySelector("#send-btn");
  const chatWindow = document.querySelector("#chat-window");
  const statusDot = document.querySelector("#status-dot");

  const escapeHtml = (s) =>
    String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  function addMessage(role, text, extraClass) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}` + (extraClass ? ` ${extraClass}` : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = text;
    wrap.append(avatar, bubble);
    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return wrap;
  }

  function showTyping() {
    return addMessage(
      "ai",
      '<span class="dot"></span><span class="dot"></span><span class="dot"></span>',
      "typing"
    );
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    sendBtn.style.opacity = busy ? "0.5" : "1";
    input.disabled = busy;
  }

  async function send(message) {
    addMessage("user", escapeHtml(message));
    input.value = "";
    input.style.height = "auto";
    setBusy(true);
    statusDot.textContent = "Đang xử lý...";

    const typing = showTyping();
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
        signal: AbortSignal.timeout(45000), // không treo UI "Đang xử lý..." vĩnh viễn
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Máy chủ đang gặp sự cố.");
      typing.remove();
      addMessage("ai", escapeHtml(data.reply || "Gemini không trả về nội dung."));
      statusDot.textContent = "Online";
    } catch (err) {
      typing.remove();
      addMessage("ai", `⚠️ ${escapeHtml(err.message || "Không thể nhận phản hồi.")}`, "error-bubble");
      statusDot.textContent = "Lỗi kết nối";
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message || input.disabled) return;
    send(message);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 128) + "px";
  });
</script>
</body>
</html>
